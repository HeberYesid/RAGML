[project]
name = "ragml"
version = "0.2.0"
description = "Local foundations for a store-independent Spanish RAG assistant."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.32,<1",
]

[project.scripts]
ragml = "ragml.cli:main"

[build-system]
requires = ["uv_build==0.9.26"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.14,<3",
    "mypy>=1.18,<3",
    "pytest>=8.3,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers -ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src"]
